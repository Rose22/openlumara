<!-- list of chats -->
<!-- -- AI GENERATED CODE (Qwen3.8-Flash-Next) :: (2026-09-16)
     the category sidebar pane is gone - categories now live in a dropdown
     above the search box. mobile drill-down logic was dropped along with
     it (the dropdown replaces it on mobile too).
     search goes through the backend (/api/chats/search, same endpoint
     as the global search modal): one debounced request returns ALL matches
     for the current category, no pagination. the paginated visibleChats
     list is untouched while searching (scroll loader hidden), so clearing
     the box is an instant switch back with no refetch. -->
<!-- -- AI GENERATED CODE (Qwen3.8-Flash-Next) :: (2026-09-26)
     tagPanel: local state for the tag filter panel toggle below -->
<div id="chat-list" x-ref="chat-list" x-cloak x-data="{ tagPanel: false }">
    <!-- -- AI GENERATED CODE (Qwen3.8-Flash-Next) :: (2026-09-16)
         category picker dropdown, replaces the old category sidebar -->
    <!-- -- AI GENERATED CODE (Qwen3.8-Flash-Next) :: (2026-09-16)
         custom dropdown (native <option>s can't render icons): trigger
         shows the active category's icon + name, menu is teleported to
         body like the chat action menu. 'general' gets home.svg, every
         other category gets folder.svg. -->
    <div class="category-select" x-data="{ open: false, top: 0, left: 0, width: 0 }">
        <button
            type="button"
            class="category-trigger"
            :class="{ 'open': open }"
            :disabled="$store.stream.state !== 'idle'"
            title="Filter chats by category"
            @click="
                const r = $el.getBoundingClientRect();
                /* overlap by 1px so the menu's top edge merges with the
                   trigger's (whose bottom border/radius is hidden while
                   open) - they read as one element */
                top = r.bottom - 1;
                left = r.left;
                width = r.width;
                open = !open;
            "
        >
            <span class="cat-icon" x-show="$store.chat.selectedCategory === 'general'">{% include 'svg/home.svg' %}</span>
            <span class="cat-icon" x-show="$store.chat.selectedCategory !== 'general'">{% include 'svg/folder.svg' %}</span>
            <span class="cat-label" x-text="$store.chat.selectedCategory"></span>
            <svg class="cat-chevron" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 12" width="12" height="12"><path fill="currentColor" d="M6 8L1 3h10z"/></svg>
        </button>
        <template x-teleport="body">
            <div class="category-menu" x-show="open" x-transition.opacity.duration.120ms
                :style="`top: ${top}px; left: ${left}px; width: ${width}px`"
                @click.stop @click.away="open = false"
                @keydown.escape.window="open = false">
                <!-- the selected category lives in the trigger, so it's
                     left out of the list (no duplicate row) -->
                <template x-for="category in $store.chat.dropdownCategories().filter(c => c !== $store.chat.selectedCategory)" :key="category">
                    <button
                        type="button"
                        class="category-option"
                        @click="$store.chat.selectCategory(category); open = false"
                    >
                        <span class="cat-icon" x-show="category === 'general'">{% include 'svg/home.svg' %}</span>
                        <span class="cat-icon" x-show="category !== 'general'">{% include 'svg/folder.svg' %}</span>
                        <span x-text="category"></span>
                    </button>
                </template>
                <div class="category-menu-divider"></div>
                <button type="button" class="category-option manage"
                    @click="$store.ui.openModal('categories'); open = false">
                    {% include 'svg/gear.svg' %}
                    <span>manage categories...</span>
                </button>
            </div>
        </template>
    </div>

    <div class="search">
        <!-- -- AI GENERATED CODE (Qwen3.8-Flash-Next) :: (2026-09-16)
             magnifier sits inside the field on the left (absolute, so
             it doesn't join the flex row); input gets left padding -->
        <span class="search-icon">{% include 'svg/search.svg' %}</span>
        <input name="search" type="text" placeholder="Search through your chats.."
            :value="$store.chat.searchQuery"
            @input.debounce="$store.chat.setSearchQuery($event.target.value)"
            :disabled="$store.stream.state !== 'idle'"
            >

        <!-- -- AI GENERATED CODE (Qwen3.8-Flash-Next) :: (2026-09-16)
             toggles searching message content in addition to titles.
             when active, results gain a 3-line snippet of the match. -->
        <button type="button" class="search-toggle"
            :class="{ 'active': $store.chat.searchInContent }"
            @click="$store.chat.setSearchInContent(!$store.chat.searchInContent)"
            :title="$store.chat.searchInContent
                ? 'Searching titles + message content (click for titles only)'
                : 'Search message content too (currently: titles only)'"
            :aria-pressed="$store.chat.searchInContent"
            :disabled="$store.stream.state !== 'idle'"
        >
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <line x1="4" y1="6" x2="20" y2="6"/>
                <line x1="4" y1="12" x2="20" y2="12"/>
                <line x1="4" y1="18" x2="14" y2="18"/>
            </svg>
        </button>

        <!-- -- AI GENERATED CODE (Qwen3.8-Flash-Next) :: (2026-09-26)
             opens/closes the tag filter panel (below). lit up whenever
             one or more tags are filtering the list. -->
        <button type="button" class="search-toggle"
            :class="{ 'active': $store.chat.selectedTags.length > 0 || tagPanel }"
            @click="tagPanel = !tagPanel"
            :title="$store.chat.selectedTags.length > 0
                ? `Filtering by: ${$store.chat.selectedTags.join(', ')} (click for tag filter)`
                : 'Filter chats by tags'"
            :aria-expanded="tagPanel"
            :disabled="$store.stream.state !== 'idle'"
        >
            {% include 'svg/tag.svg' %}
        </button>
    </div>

    <!-- -- AI GENERATED CODE (Qwen3.8-Flash-Next) :: (2026-09-26)
         tag filter panel: collapsed by default, toggled by the tag
         button above. chips toggle tags (AND semantics, handled by the
         store); 'clear filter' resets everything at once. -->
    <div class="tag-filter" x-show="tagPanel" x-transition.opacity.duration.120ms>
        <template x-if="$store.chat.availableTags.length === 0">
            <div class="tag-filter-empty">no tags in this category yet</div>
        </template>

        <div class="tag-chips" x-show="$store.chat.availableTags.length > 0">
            <template x-for="tag in $store.chat.availableTags" :key="tag">
                <button type="button" class="tag-chip"
                    :class="{ 'selected': $store.chat.selectedTags.includes(tag) }"
                    :disabled="$store.stream.state !== 'idle'"
                    @click="$store.chat.toggleTag(tag)"
                    x-text="tag">
                </button>
            </template>
        </div>

        <button type="button" class="tag-filter-clear"
            x-show="$store.chat.selectedTags.length > 0"
            @click="$store.chat.clearTags()">
            clear filter
        </button>
    </div>

    <div class="chats">
        <!-- search loading state -->
        <template x-if="$store.chat.searching && $store.chat.searchLoading && $store.chat.searchResults.length === 0">
            <div class="item">searching..</div>
        </template>

        <!-- search empty state -->
        <template x-if="$store.chat.searching && !$store.chat.searchLoading && $store.chat.searchResults.length === 0">
            <div class="item">no chats found</div>
        </template>

        <!-- -- AI GENERATED CODE (Qwen3.8-Flash-Next) :: (2026-09-17)
             option d: all day headers render from the cheap
             /api/chats/days list; each group fetches its own chats when
             expanded (paginated per day, with a per-group loader).
             today expanded by default, everything else collapsed;
             search results are grouped client-side and always open. -->
        <template x-for="group in $store.chat.displayGroups()" :key="group.key">
            <div class="day-group">
                <button type="button" class="day-header"
                    :class="{ 'expanded': !$store.chat.isGroupCollapsed(group) }"
                    :aria-expanded="!$store.chat.isGroupCollapsed(group)"
                    @click="$store.chat.toggleDayGroup(group)">
                    <svg class="day-chevron" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 12" width="10" height="10"><path fill="currentColor" d="M4 1l5 5-5 5z"/></svg>
                    <span class="day-label" x-text="group.label"></span>
                    <span class="day-count" x-show="!$store.chat.searching" x-text="group.count ?? ''"></span>
                </button>

                <template x-if="!$store.chat.isGroupCollapsed(group)">
                    <div class="day-chats">
                        <template x-for="chat in group.chats" :key="chat.id">
                    <!-- give selected chats a nice border via the CSS class -->
                    <div
                        x-data="{
                            active: false,
                            renaming: false,
                            renameValue: '',
                            menuOpen: false,
                            menuTop: 0,
                            menuLeft: 0
                        }"
                        @contextmenu.prevent="menuTop = $event.clientY; menuLeft = Math.min($event.clientX, window.innerWidth - 184); menuOpen = true"
                        :id="`chat-${chat.id}`"
                        class="item"
                        :class="{
                            'active': chat.id === $store.chat.selectedChat, 
                            'disabled': $store.stream.state !== 'idle' && chat.id !== $store.chat.selectedChat,
                            'renaming': renaming
                        }"
                        @click="
                            if (!renaming) {
                                active = !active;
                                $store.chat.loadChat(chat.id);
                                if ($store.ui.isMobile) { $store.ui.showSidebar = false; }
                            }
                        "
                        x-init="
                            $nextTick(() => {
                                if (chat.id === $store.chat.selectedChat) {
                                    $el.scrollIntoView({ behavior: 'smooth' });
                                }
                            })
                        "
                    >
                        <div>
                            <!-- -- AI GENERATED CODE (Qwen3.8-Flash-Next) :: (2026-09-17)
                                 meta line is gone (date is redundant under the day
                                 headers): single row with title on the left, then the
                                 tag icon (hover popup, same as the old pill) and the
                                 three-dot actions on the right. -->
                            <div class="title-row">
                                <template x-if="!renaming">
                                    <span class="title" x-text="chat.title || 'New chat'"></span>
                                </template>

                                <template x-if="renaming">
                                    <div class="rename-container">
                                        <input 
                                            x-ref="renameInput"
                                            type="text" 
                                            x-model="renameValue" 
                                            @keydown.enter="if (renameValue.trim()) { $store.chat.renameChat(chat.id, renameValue.trim()); } renaming = false; renameValue = ''"
                                            @keydown.escape="renaming = false; renameValue = ''"
                                            @blur="setTimeout(() => { if (renaming) { renaming = false; renameValue = ''; } }, 150)"
                                            class="rename-input"
                                        >
                                        <button @click="if (renameValue.trim()) { $store.chat.renameChat(chat.id, renameValue.trim()); } renaming = false; renameValue = ''" class="rename-action-btn save" title="Save">
                                            {% include 'svg/checkmark.svg' %}
                                        </button>
                                        <button @click="renaming = false; renameValue = ''" class="rename-action-btn cancel" title="Cancel">
                                            {% include 'svg/cross.svg' %}
                                        </button>
                                    </div>
                                </template>

                                <template x-if="(chat.tags ?? []).length > 0">
                                    <!-- popup teleported to body (chat cards
                                         transform on hover, which would trap
                                         and clip a fixed child), anchored via
                                         the icon's viewport rect -->
                                    <span class="tag-icon-wrap" x-data="{ open: false, top: 0, left: 0 }"
                                        @mouseenter="const r = $el.getBoundingClientRect(); top = r.top - 8; left = Math.max(8, Math.min(r.left, window.innerWidth - 236)); open = true"
                                        @mouseleave="open = false">
                                        {% include 'svg/tag.svg' %}
                                        <template x-teleport="body">
                                            <div class="tag-popup" x-show="open"
                                                :style="`top: ${top}px; left: ${left}px`"
                                                @mouseenter="open = true" @mouseleave="open = false"
                                                @click.stop>
                                                <template x-for="tag in (chat.tags ?? [])" :key="'popup-' + tag">
                                                    <span class="inline-tag" x-text="tag"></span>
                                                </template>
                                            </div>
                                        </template>
                                    </span>
                                </template>

                                <div class="item-actions" @click.stop
                                    :class="{ 'menu-open': menuOpen }">
                                    <button class="action-btn" :class="{ active: menuOpen }" title="Actions"
                                        @click.stop="const r = $el.getBoundingClientRect(); menuTop = r.bottom + 4; menuLeft = Math.max(8, r.right - 176); menuOpen = !menuOpen">
                                        {% include 'svg/more_vertical.svg' %}
                                    </button>
                                    <template x-teleport="body">
                                        <div class="chat-action-menu" x-show="menuOpen"
                                            :style="`top: ${menuTop}px; left: ${menuLeft}px`"
                                            @click.stop @click.away="menuOpen = false">
                                            <button @click="renaming = true; renameValue = chat.title; menuOpen = false; $nextTick(() => { $refs.renameInput.focus(); $refs.renameInput.select(); })">
                                                {% include 'svg/edit.svg' %}
                                                Rename
                                            </button>
                                            <button @click="$store.chat.moveChatTarget = chat; $store.ui.openModal('move_chat'); menuOpen = false">
                                                {% include 'svg/folder.svg' %}
                                                Move to category
                                            </button>
                                            <button class="danger" @click="$store.chat.deleteChat(chat.id); menuOpen = false">
                                                {% include 'svg/trash.svg' %}
                                                Delete
                                            </button>
                                        </div>
                                    </template>
                                </div>
                            </div>

                            <!-- 3-line content snippet (only in content-search mode) -->
                            <template x-if="$store.chat.searching && $store.chat.searchInContent && $store.chat.sidebarSnippet(chat)">
                                <div class="snippet snippet-3" x-html="$store.chat.sidebarSnippet(chat)"></div>
                            </template>
                        </div>
                    </div>
                        </template>

                        <!-- -- AI GENERATED CODE (Qwen3.8-Flash-Next) :: (2026-09-17)
                             per-day pagination loader: shows while the group
                             is expanded and has chats left to fetch (or the
                             first page hasn't landed yet). the fill loop runs
                             while it's visible (a loader that renders already
                             in view never fires x-intersect); once content
                             pushes it out, entry events take over. -->
                        <template x-if="!$store.chat.searching && (!group.loaded || group.hasMore)">
                            <div :data-day-loader="group.key"
                                x-intersect.enter="$store.chat.ensureDayChatsFilled(group, $el)"
                                class="item">loading more..</div>
                        </template>
                    </div>
                </template>
            </div>
        </template>
    </div>

    <button class="sidebar-btn" @click="$store.chat.newChat()" :disabled="$store.stream.state !== 'idle'">
        {% include 'svg/add.svg' %}
        New Chat
    </button>

</div>
