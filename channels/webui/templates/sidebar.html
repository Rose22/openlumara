<!-- list of categories -->
<div id="category-list" x-ref="category-list"
    x-show="!$store.ui.isMobile || $store.ui.showCategories" x-cloak
    >
    <div class="list">
        <template x-for="category in $store.chat.categories" :key="category">
            <ul :class="{'item': true, 'active': category == $store.chat.selectedCategory, 'disabled': $store.stream.state !== 'idle' && category !== $store.chat.selectedCategory}" @click="
                if ($store.stream.state !== 'idle') { return }

                $store.chat.selectCategory(category);
                if ($store.ui.isMobile) {
                    await $store.ui.toggleMobileSidebarView();
                }
                ">
                <span class="icon">
                    <template x-if="category === 'general'">
                        {% include 'svg/home.svg' %}
                    </template>
                    <template x-if="category != 'general'">
                        {% include 'svg/chat.svg' %}
                    </template>
                </span>
                <span class="title" x-text="category"></span>
            </ul>
        </template>
    </div>

    {% if login_enabled %}
        <div class="buttons">
            <!-- Logout button -->
            <button class="sidebar-btn" @click="if(confirm('Log out?')) window.location.href='/logout'">
                {% include 'svg/download.svg' %}
                <span>Logout</span>
            </button>
        </div>
    {% endif %}
</div>

<!-- list of chats -->
<!-- -- AI GENERATED CODE (Qwen3.8-Flash-Next) :: (2026-09-16)
     search now goes through the backend (/api/chats/search, same endpoint
     as the global search modal): one debounced request returns ALL matches
     for the current category, no pagination. the paginated visibleChats
     list is untouched while searching (scroll loader hidden), so clearing
     the box is an instant switch back with no refetch. -->
<div id="chat-list" x-ref="chat-list"
    x-show="!$store.ui.isMobile || $store.ui.showChatList" x-cloak
>
    <button class="header-btn" x-text="$store.chat.selectedCategory" x-show="$store.ui.isMobile" x-cloak @click="$store.ui.toggleMobileSidebarView()"></button>

    <div class="search">
        <input name="search" type="text" placeholder="Search through your chats.."
            :value="$store.chat.searchQuery"
            @input="$store.chat.setSearchQuery($event.target.value)">

        <!-- -- AI GENERATED CODE (Qwen3.8-Flash-Next) :: (2026-09-16)
             toggles searching message content in addition to titles.
             when active, results gain a 3-line snippet of the match. -->
        <button type="button" class="search-toggle"
            :class="{ 'active': $store.chat.searchInContent }"
            @click="$store.chat.setSearchInContent(!$store.chat.searchInContent)"
            :title="$store.chat.searchInContent
                ? 'Searching titles + message content (click for titles only)'
                : 'Search message content too (currently: titles only)'"
            :aria-pressed="$store.chat.searchInContent"
        >
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <line x1="4" y1="6" x2="20" y2="6"/>
                <line x1="4" y1="12" x2="20" y2="12"/>
                <line x1="4" y1="18" x2="14" y2="18"/>
            </svg>
        </button>
    </div>

    <div class="chats">
        <!-- search loading state -->
        <template x-if="$store.chat.searching && $store.chat.searchLoading && $store.chat.searchResults.length === 0">
            <div class="item">searching..</div>
        </template>

        <!-- search empty state -->
        <template x-if="$store.chat.searching && !$store.chat.searchLoading && $store.chat.searchResults.length === 0">
            <div class="item">no chats found</div>
        </template>

        <div class="flex fullwidth">
            <template x-for="chat in $store.chat.sidebarChats()" :key="chat.id">
                <!-- search results are already category-scoped by the
                     backend; in pagination mode only the category check
                     applies (the old client-side title filter is gone -
                     the backend does the filtering now) -->
                <template
                    x-if="
                        $store.chat.searching
                        || chat.category === $store.chat.selectedCategory
                    "
                >
                    <!-- give selected chats a nice border via the CSS class -->
                    <div
                        x-data="{ 
                            active: false, 
                            renaming: false, 
                            renameValue: ''
                        }"
                        :id="`chat-${chat.id}`"
                        class="item"
                        :class="{
                            'active': chat.id === $store.chat.selectedChat, 
                            'disabled': $store.stream.state !== 'idle' && chat.id !== $store.chat.selectedChat,
                            'renaming': renaming
                        }"
                        @click="
                            if (!renaming) {
                                active = !active;
                                $store.chat.loadChat(chat.id);
                                if ($store.ui.isMobile) { $store.ui.showSidebar = false; }
                            }
                        "
                        x-init="
                            $nextTick(() => {
                                if (chat.id === $store.chat.selectedChat) {
                                    $el.scrollIntoView({ behavior: 'smooth' });
                                }
                            })
                        "
                    >
                        <div>
                            <template x-if="!renaming">
                                <span class="title" x-text="chat.title || 'New chat'"></span>
                            </template>

                            <!-- 3-line content snippet (only in content-search mode) -->
                            <template x-if="$store.chat.searching && $store.chat.searchInContent && $store.chat.sidebarSnippet(chat)">
                                <div class="snippet snippet-3" x-html="$store.chat.sidebarSnippet(chat)"></div>
                            </template>
                            <template x-if="renaming">
                                <div class="rename-container">
                                    <input 
                                        x-ref="renameInput"
                                        type="text" 
                                        x-model="renameValue" 
                                        @keydown.enter="if (renameValue.trim()) { $store.chat.renameChat(chat.id, renameValue.trim()); } renaming = false; renameValue = ''"
                                        @keydown.escape="renaming = false; renameValue = ''"
                                        @blur="setTimeout(() => { if (renaming) { renaming = false; renameValue = ''; } }, 150)"
                                        class="rename-input"
                                    >
                                    <button @click="if (renameValue.trim()) { $store.chat.renameChat(chat.id, renameValue.trim()); } renaming = false; renameValue = ''" class="rename-action-btn save" title="Save">
                                        {% include 'svg/checkmark.svg' %}
                                    </button>
                                    <button @click="renaming = false; renameValue = ''" class="rename-action-btn cancel" title="Cancel">
                                        {% include 'svg/cross.svg' %}
                                    </button>
                                </div>
                            </template>
                            
                            <div class="meta">
                                <span class="date" x-text="formatDate(chat.updated) || 'No date known'"></span>
                                
                                <div class="item-actions" @click.stop>
                                    <button class="action-btn" @click="renaming = true; renameValue = chat.title; $nextTick(() => { $refs.renameInput.focus(); $refs.renameInput.select(); })" title="Rename">
                                        {% include 'svg/edit.svg' %}
                                    </button>
                                    <button class="action-btn delete" @click="$store.chat.deleteChat(chat.id)" title="Delete">
                                        {% include 'svg/trash.svg' %}
                                    </button>
                                </div>
                            </div>
                            
                            <ul class="tags">
                                <template x-for="tag in (chat.tags ?? []).slice(0,3)" :key="tag">
                                    <li x-text="tag" class="tag"></li>
                                </template>
                            </ul>
                        </div>
                    </div>
                </template>
            </template>
        </div>

        <!-- make sure there's always more chats than the viewport
             (hidden while searching: search mode is unpaginated) -->
        <template x-if="$store.chat.hasMoreChats && !$store.chat.searching">
            <!-- -- AI GENERATED CODE (Qwen3.8-Flash-Next) :: (2026-09-16)
                 .parent: observe intersection against the .chats scroll
                 container, not the viewport (same as the chat turns). -->
            <div id="chat-scroll-loader" x-intersect.parent="$store.chat.loadMoreChats()" class="item">loading more..</div>
        </template>
    </div>

    <button class="sidebar-btn" @click="$store.chat.newChat()" :disabled="$store.stream.state !== 'idle'">
        {% include 'svg/add.svg' %}
        New Chat
    </button>
</div>
