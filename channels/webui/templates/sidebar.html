<!-- list of chats -->
<!-- -- AI GENERATED CODE (Qwen3.8-Flash-Next) :: (2026-09-16)
     the category sidebar pane is gone - categories now live in a dropdown
     above the search box. mobile drill-down logic was dropped along with
     it (the dropdown replaces it on mobile too).
     search goes through the backend (/api/chats/search, same endpoint
     as the global search modal): one debounced request returns ALL matches
     for the current category, no pagination. the paginated visibleChats
     list is untouched while searching (scroll loader hidden), so clearing
     the box is an instant switch back with no refetch. -->
<div id="chat-list" x-ref="chat-list" x-cloak>
    <!-- -- AI GENERATED CODE (Qwen3.8-Flash-Next) :: (2026-09-16)
         category picker dropdown, replaces the old category sidebar -->
    <!-- -- AI GENERATED CODE (Qwen3.8-Flash-Next) :: (2026-09-16)
         the manage-categories modal is opened from a pseudo-option at
         the bottom of the dropdown. picking it never changes the
         selected category: the select value snaps back and the modal
         opens instead. -->
    <div class="category-select">
        <select
            :value="$store.chat.dropdownValue()"
            :disabled="$store.stream.state !== 'idle'"
            @change="
                if ($event.target.value === '__manage__') {
                    $event.target.value = $store.chat.dropdownValue();
                    $store.ui.openModal('categories');
                } else {
                    $store.chat.selectCategory($event.target.value);
                }
            "
            title="Filter chats by category"
        >
            <template x-for="category in $store.chat.dropdownCategories()" :key="category">
                <option :value="category" x-text="category"></option>
            </template>
            <option value="__manage__">manage categories...</option>
        </select>
    </div>

    <div class="search">
        <input name="search" type="text" placeholder="Search through your chats.."
            :value="$store.chat.searchQuery"
            @input.debounce="$store.chat.setSearchQuery($event.target.value)"
            :disabled="$store.stream.state !== 'idle'"
            >

        <!-- -- AI GENERATED CODE (Qwen3.8-Flash-Next) :: (2026-09-16)
             toggles searching message content in addition to titles.
             when active, results gain a 3-line snippet of the match. -->
        <button type="button" class="search-toggle"
            :class="{ 'active': $store.chat.searchInContent }"
            @click="$store.chat.setSearchInContent(!$store.chat.searchInContent)"
            :title="$store.chat.searchInContent
                ? 'Searching titles + message content (click for titles only)'
                : 'Search message content too (currently: titles only)'"
            :aria-pressed="$store.chat.searchInContent"
            :disabled="$store.stream.state !== 'idle'"
        >
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <line x1="4" y1="6" x2="20" y2="6"/>
                <line x1="4" y1="12" x2="20" y2="12"/>
                <line x1="4" y1="18" x2="14" y2="18"/>
            </svg>
        </button>
    </div>

    <div class="chats">
        <!-- search loading state -->
        <template x-if="$store.chat.searching && $store.chat.searchLoading && $store.chat.searchResults.length === 0">
            <div class="item">searching..</div>
        </template>

        <!-- search empty state -->
        <template x-if="$store.chat.searching && !$store.chat.searchLoading && $store.chat.searchResults.length === 0">
            <div class="item">no chats found</div>
        </template>

        <div class="flex fullwidth">
            <template x-for="chat in $store.chat.sidebarChats()" :key="chat.id">
                <!-- search results are already category-scoped by the
                     backend; in pagination mode only the category check
                     applies (the old client-side title filter is gone -
                     the backend does the filtering now) -->
                <template
                    x-if="
                        $store.chat.searching
                        || chat.category === $store.chat.selectedCategory
                    "
                >
                    <!-- give selected chats a nice border via the CSS class -->
                    <div
                        x-data="{
                            active: false,
                            renaming: false,
                            renameValue: '',
                            menuOpen: false,
                            menuTop: 0,
                            menuLeft: 0
                        }"
                        @contextmenu.prevent="menuTop = $event.clientY; menuLeft = Math.min($event.clientX, window.innerWidth - 184); menuOpen = true"
                        :id="`chat-${chat.id}`"
                        class="item"
                        :class="{
                            'active': chat.id === $store.chat.selectedChat, 
                            'disabled': $store.stream.state !== 'idle' && chat.id !== $store.chat.selectedChat,
                            'renaming': renaming
                        }"
                        @click="
                            if (!renaming) {
                                active = !active;
                                $store.chat.loadChat(chat.id);
                                if ($store.ui.isMobile) { $store.ui.showSidebar = false; }
                            }
                        "
                        x-init="
                            $nextTick(() => {
                                if (chat.id === $store.chat.selectedChat) {
                                    $el.scrollIntoView({ behavior: 'smooth' });
                                }
                            })
                        "
                    >
                        <div>
                            <template x-if="!renaming">
                                <span class="title" x-text="chat.title || 'New chat'"></span>
                            </template>

                            <!-- 3-line content snippet (only in content-search mode) -->
                            <template x-if="$store.chat.searching && $store.chat.searchInContent && $store.chat.sidebarSnippet(chat)">
                                <div class="snippet snippet-3" x-html="$store.chat.sidebarSnippet(chat)"></div>
                            </template>
                            <template x-if="renaming">
                                <div class="rename-container">
                                    <input 
                                        x-ref="renameInput"
                                        type="text" 
                                        x-model="renameValue" 
                                        @keydown.enter="if (renameValue.trim()) { $store.chat.renameChat(chat.id, renameValue.trim()); } renaming = false; renameValue = ''"
                                        @keydown.escape="renaming = false; renameValue = ''"
                                        @blur="setTimeout(() => { if (renaming) { renaming = false; renameValue = ''; } }, 150)"
                                        class="rename-input"
                                    >
                                    <button @click="if (renameValue.trim()) { $store.chat.renameChat(chat.id, renameValue.trim()); } renaming = false; renameValue = ''" class="rename-action-btn save" title="Save">
                                        {% include 'svg/checkmark.svg' %}
                                    </button>
                                    <button @click="renaming = false; renameValue = ''" class="rename-action-btn cancel" title="Cancel">
                                        {% include 'svg/cross.svg' %}
                                    </button>
                                </div>
                            </template>
                            
                            <!-- -- AI GENERATED CODE (Qwen3.8-Flash-Next) :: (2026-09-16)
                                 tags now sit inline after the date; overflow
                                 tags hide and show in a hover popup -->
                            <div class="meta">
                                <div class="meta-inline">
                                    <span class="date" x-text="formatDate(chat.updated) || 'No date known'"></span>
                                    <template x-if="(chat.tags ?? []).length > 0">
                                        <!-- -- AI GENERATED CODE (Qwen3.8-Flash-Next) :: (2026-09-16)
                                             popup is teleported to body (chat cards
                                             transform on hover, which would trap and
                                             clip a fixed child) and anchored via the
                                             cluster's viewport rect on mouseenter -->
                                        <span class="inline-tags" x-data="{ open: false, top: 0, left: 0 }"
                                            @mouseenter="const r = $el.getBoundingClientRect(); top = r.top - 8; left = Math.max(8, Math.min(r.left, window.innerWidth - 236)); open = true"
                                            @mouseleave="open = false">
                                            <span class="inline-tag" x-text="(chat.tags ?? [])[0]"></span>
                                            <span
                                                x-show="(chat.tags ?? []).length > 1"
                                                class="tag-more"
                                                x-text="'+' + ((chat.tags ?? []).length - 1)"
                                            ></span>
                                            <template x-teleport="body">
                                                <div class="tag-popup" x-show="open && (chat.tags ?? []).length > 1"
                                                    :style="`top: ${top}px; left: ${left}px`"
                                                    @mouseenter="open = true" @mouseleave="open = false"
                                                    @click.stop>
                                                    <template x-for="tag in (chat.tags ?? []).slice(1)" :key="'popup-' + tag">
                                                        <span class="inline-tag" x-text="tag"></span>
                                                    </template>
                                                </div>
                                            </template>
                                        </span>
                                    </template>
                                </div>

                                <!-- -- AI GENERATED CODE (Qwen3.8-Flash-Next) :: (2026-09-16)
                                     three-dot button replaces the inline action
                                     buttons; dropdown is teleported to body so
                                     the card's overflow can't clip it -->
                                <div class="item-actions" @click.stop
                                    :class="{ 'menu-open': menuOpen }">
                                    <button class="action-btn" :class="{ active: menuOpen }" title="Actions"
                                        @click.stop="const r = $el.getBoundingClientRect(); menuTop = r.bottom + 4; menuLeft = Math.max(8, r.right - 176); menuOpen = !menuOpen">
                                        {% include 'svg/more_vertical.svg' %}
                                    </button>
                                    <template x-teleport="body">
                                        <div class="chat-action-menu" x-show="menuOpen"
                                            :style="`top: ${menuTop}px; left: ${menuLeft}px`"
                                            @click.stop @click.away="menuOpen = false">
                                            <button @click="renaming = true; renameValue = chat.title; menuOpen = false; $nextTick(() => { $refs.renameInput.focus(); $refs.renameInput.select(); })">
                                                {% include 'svg/edit.svg' %}
                                                Rename
                                            </button>
                                            <button @click="$store.chat.moveChatTarget = chat; $store.ui.openModal('move_chat'); menuOpen = false">
                                                {% include 'svg/folder.svg' %}
                                                Move to category
                                            </button>
                                            <button class="danger" @click="$store.chat.deleteChat(chat.id); menuOpen = false">
                                                {% include 'svg/trash.svg' %}
                                                Delete
                                            </button>
                                        </div>
                                    </template>
                                </div>
                            </div>
                            
                        </div>
                    </div>
                </template>
            </template>
        </div>

        <!-- make sure there's always more chats than the viewport
             (hidden while searching: search mode is unpaginated) -->
        <template x-if="$store.chat.hasMoreChats && !$store.chat.searching">
            <!-- -- AI GENERATED CODE (Qwen3.8-Flash-Next) :: (2026-09-16)
                 .parent: observe intersection against the .chats scroll
                 container, not the viewport (same as the chat turns). -->
            <div id="chat-scroll-loader" x-intersect.parent="$store.chat.loadMoreChats()" class="item">loading more..</div>
        </template>
    </div>

    <button class="sidebar-btn" @click="$store.chat.newChat()" :disabled="$store.stream.state !== 'idle'">
        {% include 'svg/add.svg' %}
        New Chat
    </button>

</div>
