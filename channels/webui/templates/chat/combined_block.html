<!-- -- AI GENERATED CODE (Qwen3.8-Flash-Next) :: (2026-10-01)
     one collapsible header per agentic STEP. steps arrive precomputed:
     history via turn.steps (core/turns.py group_history), streaming via
     streamSteps() folding backend-stamped segments. header = numbered
     circle + module-grouped tool names rendered straight from
     step.modules. {% set combined_stream = true %} switches to the
     streaming behaviour: activity dots while this is the newest segment,
     auto-collapse once done (mirrors reasoning.html). -->
<div class="combined-block" :class="{collapsed: collapsed, expanded: !collapsed}"
    {% if combined_stream %}
     x-data="{ collapsed: $store.stream.state === 'idle' || localStorage.getItem('collapseStepsDefault') === 'true', autoCollapsed: false, done: $store.stream.state === 'idle',
               // -- AI GENERATED CODE (Qwen3.8-Flash-Next) :: (2026-10-01)
               // reasoning is live only while the newest stream segment is
               // this step's reasoning: once content/tools arrive the
               // header reads Thoughts even though the step is still open
               get thinkingActive() {
                   const msgs = $store.stream.turn?.messages ?? [];
                   const last = msgs[msgs.length - 1];
                   return !!last && last.step === message.step && last.type === 'reasoning';
               },
               // -- AI GENERATED CODE (Qwen3.8-Flash-Next) :: (2026-10-01)
               // activity only while the step's own status is open: a
               // finished tool step at the end of the chain (waiting for
               // the model's next step) must not keep pulsing
               get active() { return !this.done && (message.status === 'thinking' || message.status === 'running') } }"
     x-effect="const msgs = $store.stream.turn?.messages ?? []; const hasNewerStep = msgs.some(m => m.step != null && m.step > message.step); done = $store.stream.state === 'idle' || hasNewerStep || message.status === 'done' || message.status === 'failed' || message.status === 'thoughts'; if (done && !autoCollapsed) { autoCollapsed = true; if (localStorage.getItem('collapseStepsDefault') !== 'true') collapsed = true }"
    {% else %}
     x-data="{ collapsed: true }"
    {% endif %}>
    <!-- timeline node: the whole step collapses/expands as one -->
    <div class="node-dot" :class="{expanded: !collapsed}" @click.stop="collapsed = !collapsed">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 6 15 12 9 18"></polyline></svg>
    </div>
    <div class="header" @click="collapsed = !collapsed">
        <svg class="standalone-chevron" :class="{'expanded': !collapsed}" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="9 6 15 12 9 18"></polyline>
        </svg>
        <span class="step-badge" x-text="message.step"
            :class="{ 'step-failed': message.status === 'failed' }"></span>
        <span class="text">
            <span class="dots" {% if combined_stream %}x-show="active && (message.modules?.length > 0 || thinkingActive)"{% else %}x-show="false"{% endif %}><span aria-hidden="true">&nbsp;</span><span aria-hidden="true">&nbsp;</span><span aria-hidden="true">&nbsp;</span></span>
            <!-- module-grouped tool names straight from step.modules:
                 "Coder: file edit x2 · Memory create" - separators via css -->
            <span class="tool-names" x-show="message.modules?.length > 0">
                <template x-for="(group, gi) in message.modules" :key="gi">
                    <span class="module-group">
                        <span class="tool-module" x-show="group.actions.some(a => a.name)" x-text="group.module + ':'"></span>
                        <template x-for="(action, ai) in group.actions.filter(a => a.name)" :key="'act-'+ai">
                            <span class="tool-action">
                                <span x-text="(ai > 0 ? ', ' : '') + action.name.replaceAll('_', ' ')"></span><span class="tool-repeat" x-show="action.count > 1" x-text="'x' + action.count"></span>
                            </span>
                        </template>
                    </span>
                </template>
            </span>
            <!-- tool-less step: label it so the header isn't empty.
                 live reasoning reads Thinking.., finished reads Thoughts -->
            <span class="tool-names" x-show="!message.modules || message.modules.length === 0"
                  {% if combined_stream %}
                  x-text="message.reasoning_content ? (thinkingActive ? 'Thinking..' : 'Thoughts') : 'writing'"></span>
                  {% else %}
                  x-text="message.reasoning_content ? 'Thoughts' : 'writing'"></span>
                  {% endif %}
            <!-- -- AI GENERATED CODE (Qwen3.8-Flash-Next) :: (2026-10-01)
                 single-call step: arg + result summaries ride along in the
                 step header (same helpers + cacheKey the tool card uses)
                 -- AI GENERATED CODE (Qwen3.8-Flash-Next) :: (2026-10-01)
                 args show LIVE while streaming (backend summary now uses
                 the lenient parser); only the result summary still waits
                 for tool.response, matching the tool card -->
            <span class="step-args" x-show="message.tool_calls?.length === 1"
                  x-text="message.tool_calls?.[0]?.summary ?? ''"></span>
            <span class="step-summary" x-show="message.tool_calls?.length === 1 && message.tool_calls[0].response"
                  x-text="message.tool_calls?.[0]?.response ? toolCallResultSummary(message.tool_calls[0], message.tool_calls[0].id ?? (message.tool_call_id + ':0')) : ''"></span>
        </span>
    </div>
    <div x-show="!collapsed" x-collapse.duration.250>
        <div class="block">
            <!-- reasoning gets the thought bubble, like a mini Thoughts
                 block inside the step -->
            <div class="reasoning-row" x-show="message.reasoning_content">
                {% include 'svg/thought_bubble.svg' %}
                <div class="reasoning-text" x-fade-text="message.reasoning_content" x-auto-scroll></div>
            </div>
            <!-- intermediate content riding along with the step (the model
                 narrating before/while it calls tools) -->
            <template x-if="message.content">
                {% if combined_stream %}
                <!-- -- AI GENERATED CODE (Qwen3.8-Flash-Next) :: (2026-10-01)
     optional-chain BOTH messages accesses: the stream store's turn
     starts as a bare [] with no messages key, which threw here -->
<div class="step-content" x-md="{ message: message, live: ($store.stream.turn?.messages ?? [])[($store.stream.turn?.messages?.length ?? 1) - 1] === message._tail }"></div>
                {% else %}
                <div class="step-content" x-md="{ message: message, live: false }"></div>
                {% endif %}
            </template>
            <!-- -- AI GENERATED CODE (Qwen3.8-Flash-Next) :: (2026-10-01)
                 flag for toolcalls.html: its first card defaults to expanded
                 inside steps - see toolcalls.html -->
            {% set toolcard_in_step = True %}
            {% include 'chat/toolcalls.html' %}
        </div>
    </div>
</div>
