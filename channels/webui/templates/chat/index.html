<!-- chat header -->
{% if config.get('enable_chat_header') %}
    {% include 'chat/header.html' %}
{% endif %}
{% if config.get('enable_chat_titlebar') %}
    {% include 'chat/titlebar.html' %}
{% endif %}

<template x-if="$store.ui.notice">
    <div class="notice" x-html="$store.ui.notice"></div>
</template>

<!-- the main message view -->
<div id="messages" x-ref="messages" x-cloak
    @scroll.throttle="
        const el = $el;
        const distFromBottom = el.scrollHeight - el.scrollTop - el.clientHeight;
        $store.ui.shouldScroll = distFromBottom < $store.ui.scrollThreshold;
    "
>
    <!--
        a "turn" is:
            when it's a user turn:
                just one message which is the user's request

            when it's an AI turn:
                all messages emitted by the assistant after a user's request

                this can be reasoning (thinking), content, partial toolcalls, full toolcalls,
                tool responses, and so on.

        the grouping of raw messages into turns happens in the backend, in core/turn.py
        see that file for more information on how this works.

        any channel can use channel.group_stream() to get an array of grouped turns,
        just like what the webUI uses here!
    -->

    <!-- historical turns -->
    <!--
        -- AI GENERATED CODE (Qwen3.8-Flash-Next) :: (2026-09-15)
        lazy-mounted turns: long-running chats were hoarding ~1gb of tab ram
        because every turn's full markdown/hljs dom was mounted permanently.
        turns now only mount once they approach the viewport (one-way, so no
        unmount-jank when scrolling back up), with a rough height estimate as
        placeholder to keep the scrollbar sane. the last few turns always
        mount immediately so new messages never flash.

        -- AI GENERATED CODE (Qwen3.8-Flash-Next) :: (2026-09-15)
        hard cap: turns now also UNMOUNT once they drift >2500px outside the
        viewport, so mounted dom stays bounded no matter how long the chat
        gets. the 800px mount / 2500px unmount margins give hysteresis, so a
        turn can never oscillate between the two states at the same scroll
        position. remounting is cheap: the markdown cache serves the html.
        chrome's scroll anchoring absorbs the height change when unmounting
        above the viewport.
    -->
    <template x-for="(turn, turnIndex) in $store.chat.turnHistory" :key="turnIndex">
        <div class="fullwidth turn" :data-turn-index="turnIndex"
            x-data="{ rendered: turnIndex > ($store.chat.turnHistory.length - 2) }"
            x-intersect:enter.parent.margin.800px="$store.ui.adjustScroll($el, () => rendered = true)"
            x-intersect:leave.parent.margin.2500px="$store.ui.captureTurnHeight(turn, $el); $store.ui.adjustScroll($el, () => rendered = false)">

            <template x-if="!rendered">
                <div class="turn-lazy" :style="`min-height: ${$store.ui.turnPlaceholderHeight(turn)}px`"></div>
            </template>

            <template x-if="rendered">
                <div>
            <!-- user turn (always one message) -->
            <template x-if="turn.role === 'user'">
                <div class="message-wrapper user" x-data="{ get message() { return turn.messages[0] } }">
                    <div class="message user">
                        {% include 'chat/turns/user.html' %}
                        <div x-data="{ get targetIndex() { return turn.first_message_index } }" class="fullwidth">
                        </div>
                    </div>
                    {% include 'chat/message_buttons.html' %}
                </div>
            </template>

            <!-- assistant turn (multiple messages combined into one bubble) -->
            <template x-if="turn.role === 'assistant'">
                <div class="message-wrapper assistant">
                    <div class="message assistant">
                        <!-- -- AI GENERATED CODE (Qwen3.8-Flash-Next) :: (2026-09-16)
                             everything that isn't the turn's final content (the
                             thinking -> toolcall -> thinking chain) is grouped into
                             a collapsible wrapper. history turns start collapsed -->
                        <template x-if="historyTurnSplit(turn).chain.length > 0">
                            <div class="agent-chain" x-data="{ collapsed: true }">
                                <div class="agent-chain-header" @click="collapsed = !collapsed">
                                    <svg :class="{'toggle': true, 'toggle-expanded': !collapsed}" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <polyline points="9 18 15 12 9 6"></polyline>
                                    </svg>
                                    {% include 'svg/gear.svg' %}
                                    <span class="label">Process</span>
                                </div>
                                <template x-if="!collapsed">
                                    <div class="agent-chain-body">
                                        <template x-for="(message, messageIndex) in historyTurnSplit(turn).chain" :key="messageIndex">
                                            {% include 'chat/turns/assistant_history.html' %}
                                        </template>
                                    </div>
                                </template>
                            </div>
                        </template>

                        <template x-for="(message, messageIndex) in historyTurnSplit(turn).final" :key="'final-'+messageIndex">
                            {% include 'chat/turns/assistant_history.html' %}
                        </template>

                        <div x-data="{ get targetIndex() { return turn.last_message_index } }" class="fullwidth">
                            {% include 'chat/message_buttons.html' %}
                        </div>
                    </div>
                </div>
            </template>
                </div>
            </template>
            <!-- /lazy-mount wrappers -->
        </div>
    </template>

    <!-- streaming assistant turn -->
    <template x-if="$store.stream.turn.messages">
        <div class="message-wrapper assistant">
            <div class="message assistant">
                <!-- -- AI GENERATED CODE (Qwen3.8-Flash-Next) :: (2026-09-16)
                     streaming chain wrapper: expanded while streaming (content
                     renders standalone until a newer segment pulls it back into
                     the chain), but manually toggable -->
                <template x-if="streamTurnSplit($store.stream.turn).chain.length > 0">
                    <div class="agent-chain is-streaming" x-data="{ collapsed: false }">
                        <div class="agent-chain-header" @click="collapsed = !collapsed">
                            <svg :class="{'toggle': true, 'toggle-expanded': !collapsed}" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="9 18 15 12 9 6"></polyline>
                            </svg>
                            {% include 'svg/gear.svg' %}
                            <span class="label">Process</span>
                        </div>
                        <template x-if="!collapsed">
                            <div class="agent-chain-body">
                                <template x-for="(message, messageIndex) in streamTurnSplit($store.stream.turn).chain" :key="messageIndex">
                                    {% include 'chat/turns/assistant_stream.html' %}
                                </template>
                                <template x-if="$store.stream.state === 'processing_tools'">
                                    {% include 'chat/prompt_processing.html' %}
                                </template>
                            </div>
                        </template>
                    </div>
                </template>

                <template x-for="(message, messageIndex) in streamTurnSplit($store.stream.turn).final" :key="'final-'+messageIndex">
                    {% include 'chat/turns/assistant_stream.html' %}
                </template>
            </div>
        </div>
    </template>

    <!-- typing indicator -->
    <template x-if="$store.stream.state === 'message_sending' || $store.stream.state === 'message_received'">
        <div class="message-wrapper">
            <div class="typing-indicator" id="typing" aria-label="AI is typing" x-ignore>
                <span></span><span></span><span></span>
            </div>
        </div>
    </template>

    <!-- prompt processing indicator (works with llama.cpp and derivatives) -->
    <template x-if="$store.stream.state === 'processing'">
        <div class="message-wrapper">
            {% include 'chat/prompt_processing.html' %}
        </div>
    </template>
</div>

<!-- invisible upload form -->
{% include 'chat/upload.html' %}

<!-- token usage bar -->
{% include 'chat/token_bar.html' %}

<!-- input field -->
<div id="input">
    {% include 'chat/input.html' %}
</div>
