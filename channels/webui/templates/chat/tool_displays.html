<!-- -- AI GENERATED CODE (Qwen3.8-Flash-Next) :: (2026-09-18)
     custom body views for claimed tool calls. this file holds the VIEW
     MARKUP only; the display system lives in js/renderers/tool_display.js,
     the per-view helpers/registrations in js/renderers/custom_tool_views.js,
     and the view styling in css/chat/custom_tool_views.css.
     one branch per view name; toolDisplayView(tool) picks it. plugins will
     later contribute their own branches the same way. no html string
     generation anywhere - everything here is plain alpine markup.
     `tool` and `cacheKey` come from the including template's scope. -->

<!-- -- AI GENERATED CODE (Qwen3.8-Flash-Next) :: (2026-10-01)
     error handling unified: failed calls no longer render per-view error
     branches - a shared .display-error row (toolcalls.html) now shows the
     error text below whichever view is active. -->
<template x-if="toolDisplayView(tool) === 'web-search'"
          x-data="{ get response() { return toolResponse(tool) },
                    get results() { return searchResults(this.response) } }">
    <div>
        <div class="search-results" x-show="results.length">
            <template x-for="res in results">
                <div class="search-card">
                    <div class="search-title-row">
                        <a class="search-title" x-show="res.url" :href="res.url"
                           target="_blank" rel="noopener noreferrer" x-text="res.title"></a>
                        <span class="search-title plain" x-show="!res.url" x-text="res.title"></span>
                        <img class="search-thumb" x-show="res.thumb" :src="res.thumb" loading="lazy" alt="">
                    </div>
                    <div class="search-url" x-show="res.url" x-text="res.url"></div>
                    <div class="search-snippet" x-show="res.snippet" x-text="res.snippet"></div>
                </div>
            </template>
        </div>
    </div>
</template>

<template x-if="toolDisplayView(tool) === 'file-read'"
          x-data="{ get args() { return toolArgs(tool, cacheKey) },
                    get response() { return toolResponse(tool) },
                    get html() {
                        // error responses carry the message in content -
                        // don't paint it as a code block, the shared
                        // .display-error row below the view shows it
                        if (this.response && this.response.status === 'error') return '';
                        return codeLinesHtml(this.response?.content, langForPath(this.args.path), this.args.line_start, cacheKey);
                    } }">
    <div>
        <!-- read: highlighted code block (error responses render nothing
             here; the shared .display-error row below the view shows the
             failure). x-html is the one sanctioned escape hatch: hljs
             output is escaped markup -->
        <div class="file-read-box hljs" x-show="html" x-html="html"></div>
        <div class="display-footer" x-show="args.sandbox || args.path" x-text="coderFooterText(args)"></div>
        <div class="grep-note" x-show="response?.truncation_note" x-text="response?.truncation_note ?? ''"></div>
    </div>
</template>

<template x-if="toolDisplayView(tool) === 'file-create'"
          x-data="{ get args() { return toolArgs(tool, cacheKey) },
                    get response() { return toolResponse(tool) },
                    get html() { return codeLinesHtml(this.args.content, langForPath(this.args.path), 1, cacheKey) } }">
    <div>
        <!-- the new file's content, highlighted, streaming live from the
             args (no response needed - creation is the last step). a failed
             create renders no box; the shared .display-error row shows the
             reason. x-fade-html fades in the new tail chars per paint;
             faded chars sit inside their hljs token spans so they keep
             their colors -->
        <div class="file-read-box hljs" x-show="html" x-auto-scroll x-fade-html="html"></div>
        <div class="display-footer" x-show="args.sandbox || args.path" x-text="coderFooterText(args)"></div>
    </div>
</template>

<template x-if="toolDisplayView(tool) === 'tools-load'"
          x-data="{ get args() { return toolArgs(tool, cacheKey) },
                    get modules() { return toolLoadModules(this.args) } }">
    <div>
        <div class="module-chips" x-show="modules.length">
            <template x-for="mod in modules">
                <span class="module-chip">
                    {% include 'svg/plug.svg' %}
                    <span x-text="mod"></span>
                </span>
            </template>
        </div>
    </div>
</template>

<template x-if="toolDisplayView(tool) === 'scheduler-job'"
          x-data="{ get args() { return toolArgs(tool, cacheKey) },
                    get info() { return schedulerInfo(this.args) } }">
    <div class="job-card">
        <div class="job-when">
            {% include 'svg/clock.svg' %}
            <span x-text="info.when || 'whenever'"></span>
            <template x-for="tag in info.tags">
                <span class="job-tag" x-text="tag"></span>
            </template>
        </div>
        <div class="job-action" x-show="info.action" x-text="info.action"></div>
    </div>
</template>

<template x-if="toolDisplayView(tool) === 'grep'"
          x-data="{ get args() { return toolArgs(tool, cacheKey) },
                    get response() { return toolResponse(tool) },
                    get groups() { return grepGroups(this.response, this.args) } }">
    <!-- single root element: x-if only renders the template's FIRST child -->
    <div>
        <!-- while running (no response yet): live preview of the args, eg.
             "searching 'pattern' in sub/path" - streams in as they arrive -->
        <div class="grep-running" x-show="!response">
            <span class="grep-running-label">searching</span>
            <span class="grep-running-pattern" x-show="args.regex_pattern" x-text="args.regex_pattern"></span>
            <span class="grep-running-label" x-show="args.regex_pattern && (args.sandbox || args.file_path || args.sub_path)">in</span>
            <span class="grep-running-pattern" x-show="args.sandbox || args.file_path || args.sub_path"
                  x-text="(args.sandbox ? args.sandbox + ': ' : '') + (args.file_path ?? args.sub_path ?? '')"></span>
        </div>
        <div class="grep-results" x-show="groups.length">
            <template x-for="g in groups">
                <div class="grep-file">
                    <div class="grep-file-name" x-text="g.file"></div>
                    <div class="grep-box">
                        <template x-for="row in grepRows(g.matches)">
                            <div class="grep-line" :class="'grep-' + row.kind">
                                <span class="grep-num" x-text="row.num"></span>
                                <span class="grep-text" x-text="row.text"></span>
                            </div>
                        </template>
                    </div>
                </div>
            </template>
        </div>
    </div>
</template>

<template x-if="toolDisplayView(tool) === 'coder-path'"
          x-data="{ get args() { return toolArgs(tool, cacheKey) },
                    get response() { return toolResponse(tool) },
                    get info() { return coderRunningInfo(tool, cacheKey) },
                    get files() { return globFiles(this.response) } }">
    <!-- single root element: x-if only renders the template's FIRST child -->
    <div>
        <!-- while running (no response yet): dim one-liner of the streamed
             args, eg. "moving · dev: foo/bar.py" - same idea as the grep
             running preview. hidden once the call settles (errors are shown
             by the shared .display-error row below the view) -->
        <div class="grep-running" x-show="!response">
            <span class="grep-running-label" x-text="info.label"></span>
            <span class="grep-running-pattern" x-show="info.sandbox || info.path"
                  x-text="(info.sandbox ? info.sandbox + ': ' : '') + info.path"></span>
        </div>
        <!-- glob results: plain file list -->
        <div class="glob-files" x-show="files.length">
            <template x-for="f in files">
                <div class="glob-file" x-text="f"></div>
            </template>
        </div>
        <div class="grep-note" x-show="response?.content?.note" x-text="response?.content?.note ?? ''"></div>
        <div class="display-footer" x-show="response && response.status !== 'error' && (args.sandbox || args.path || args.orig_path)"
             x-text="coderFooterText({ sandbox: args.sandbox, path: args.path ?? args.orig_path })"></div>
    </div>
</template>

<template x-if="toolDisplayView(tool) === 'shell'"
          x-data="{ get info() { return shellViewInfo(tool, cacheKey) },
                    get commandHtml() { return shellCommandHtml(this.info.command, cacheKey) } }">
    <!-- single root element: x-if only renders the template's FIRST child -->
    <div class="shell-box" x-auto-scroll>
        <!-- terminal look: prompt symbol + command streaming in via token
             fade, blinking cursor trails it until the output lands.
             highlighted with the bash grammar while streaming too - hljs
             tolerates partial input, tokens recolor as the command grows.
             inline flow (no flex) so the cursor follows the LAST CHARACTER
             across wrapped lines instead of hanging off the whole span -->
        <div class="shell-prompt">
            <span class="shell-prompt-symbol">$</span><span class="shell-command hljs" x-fade-html="commandHtml"></span><span class="shell-cursor" x-show="!info.done"></span>
        </div>
        <!-- dashed divider between a multiline command and its output, so
             where the command ends stays clear; single-line commands need
             no separator -->
        <div class="shell-divider" x-show="info.multiline && info.output"></div>
        <!-- output appears below the command once the call completes, as if
             printed by the shell itself; cursor is gone by then -->
        <div class="shell-output" x-show="info.output" x-fade-text="info.output"></div>
    </div>
</template>

<template x-if="toolDisplayView(tool) === 'coder-file-edit'"
          x-data="{ get args() { return toolArgs(tool, cacheKey) },
                    get html() { return diffHtml(this.args.original_code, this.args.replacement_code, langForPath(this.args.path), cacheKey) },
                    get sideHtml() { return diffSideHtml(this.args.original_code, this.args.replacement_code, langForPath(this.args.path), cacheKey) } }">
    <div class="diff-container">
        <!-- both views render as html strings: token fade needs whole-content
             repaints (x-fade-html), which x-for rows can't survive. see
             diffHtml()/diffSideHtml() in custom_tool_views.js. which one
             shows is a css container query on this .diff-container's width
             (custom_tool_views.css): side-by-side once the card is wide
             enough, unified below - follows the chat width setting -->
        <div class="tool-display hljs diff-unified" x-show="html" x-auto-scroll x-fade-html="html"></div>
        <div class="diff-side hljs" x-show="sideHtml" x-auto-scroll x-fade-html="sideHtml"></div>
        <div class="display-footer" x-show="args.sandbox || args.path" x-text="coderFooterText(args)"></div>
    </div>
</template>
