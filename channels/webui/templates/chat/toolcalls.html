<div class="flex fullwidth nogaps">
    <template x-for="tool in message.tool_calls">
        <div>
            <div class="tool-calls-container" x-data="{ collapsed: $store.stream.state === 'idle' }">
                <div class="tool-call-card">
                    <div class="header" @click="collapsed = !collapsed">
                        <svg :class="{'toggle': true, 'toggle-expanded': !collapsed}" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>
                        {% include 'svg/wrench.svg' %}
                        <span class="name" x-show="tool.function?.name">
                          <span class="module" x-text="tool.function?.name.split('_')[0].replace(/^\w/, c => c.toUpperCase())+': '"></span>
                          <span x-text="tool.function?.name.split('_').slice(1).join(' ')"></span>
                        </span>
                        <span class="name" x-show="!tool.function?.name">unknown</span>
                        <template x-if="!tool.response">
                            <span class="status pending">calling...</span>
                        </template>
                    </div>

                    <!-- -- AI GENERATED CODE (Qwen3.8-Flash-Next) :: (2026-09-16)
                         x-show -> x-if: collapsed tool cards now unmount their
                         body entirely, so the args rows and the (potentially
                         huge) toolResultsRenderer output of completed tool
                         calls don't sit in the dom while collapsed. -->
                    <template x-if="!collapsed">
                    <div class="body">
                        <div class="section">
                            <div class="args">
                                <div class="title">Arguments</div>
                                <template x-for="(value, key) in partialJsonParse(tool.function?.arguments ?? '{}')">
                                    <div class="arg-row">
                                        <span class="arg-name" x-text="key"></span>
                                        <span class="arg-value" x-text="value"></span>
                                    </div>
                                </template>

                                <template x-if="tool.response">
                                    <div class="tool-response-section">
                                        <div class="title">Response</div>
                                        <div class="content">
                                             <div x-data="{
                                                     get isJson() {
                                                        try {
                                                            JSON.parse(this.tool.response);
                                                            return true;
                                                        } catch {
                                                            return false;
                                                        }
                                                    }
                                                }">
                                                 <!-- if it's json, use our complex function to show the response in a fancy way -->
                                                <template x-if="isJson">
                                                    <div class="content" x-html="toolResultsRenderer(JSON.parse(tool.response), 0)"></div>
                                                </template>
                                                <!-- if not, show it as a raw string, formatted nicely -->
                                                <template x-if="!isJson">
                                                    <p x-text="tool.response" class="raw-response"></p>
                                                </template>
                                            </div>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>
                    </template>
                </div>
            </div>
        </div>
    </template>

</div>
