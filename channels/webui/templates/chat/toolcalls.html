<div class="flex fullwidth nogaps">
    <template x-for="(tool, toolIdx) in message.tool_calls">
        <div>
            <!-- -- AI GENERATED CODE (Qwen3.8-Flash-Next) :: (2026-09-16)
                 Auto-collapse each tool card the moment its response arrives
                 during streaming. autoCollapsed guards against re-collapsing
                 if the user manually expands it again mid-stream. -->
            <div class="tool-calls-container"
                 x-data="{ collapsed: $store.stream.state === 'idle' || !!tool.response, autoCollapsed: false }"
                 x-effect="if (tool.response && !autoCollapsed) { autoCollapsed = true; collapsed = true }">
                <div class="tool-call-card">
                    <!-- -- AI GENERATED CODE (Qwen3.8-Flash-Next) :: (2026-09-17)
                         timeline node: circle + chevron on the spine (design B) -->
                    <div class="node-dot" :class="{expanded: !collapsed}" @click.stop="collapsed = !collapsed">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 6 15 12 9 18"></polyline></svg>
                    </div>
                    <div class="header" @click="collapsed = !collapsed">
                        {% include 'svg/wrench.svg' %}
                        <span class="name" x-show="tool.function?.name">
                          <!-- -- AI GENERATED CODE (Qwen3.8-Flash-Next) :: (2026-09-16)
                               function names also stream in via tool_call_delta -->
                          <span class="module" x-fade-text="tool.function?.name.split('_')[0].replace(/^\w/, c => c.toUpperCase())+': '"></span>
                          <span x-fade-text="tool.function?.name.split('_').slice(1).join(' ')"></span>
                        </span>
                        <span class="name" x-show="!tool.function?.name">unknown</span>
                    </div>

                    <!-- -- AI GENERATED CODE (Qwen3.8-Flash-Next) :: (2026-09-17)
                         roomier skeleton: uppercase section titles dropped,
                         args + response are rows in one grid, long values get
                         a soft scroll box (via x-box) only when they overflow. -->
                    <template x-if="!collapsed">
                    <div class="body">
                        <template x-for="(value, key) in partialJsonParse(tool.function?.arguments ?? '{}', tool.id ?? (message.tool_call_id + ':' + toolIdx))">
                            <div class="arg-row">
                                <span class="arg-name" x-fade-text="key"></span>
                                <span class="arg-value" x-box x-auto-scroll x-fade-text="(value !== null && typeof value === 'object') ? JSON.stringify(value, null, 2) : value"></span>
                            </div>
                        </template>

                        <template x-if="tool.response">
                            <div class="response-row" x-data="{
                                     get parsed() {
                                        try {
                                            const p = JSON.parse(this.tool.response);
                                            return (p !== null && typeof p === 'object') ? p : null;
                                        } catch {
                                            return null;
                                        }
                                     }
                                 }">
                            <template x-if="parsed !== null">
                                <div class="content" x-html="toolResultsRenderer(parsed, 0)"></div>
                            </template>
                            <template x-if="parsed === null">
                                <p x-fade-text="tool.response" class="raw-response"></p>
                            </template>
                            </div>
                        </template>
                    </div>
                    </template>
                </div>
            </div>
        </div>
    </template>

</div>
