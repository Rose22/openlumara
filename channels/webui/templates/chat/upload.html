<!-- -- AI GENERATED CODE (Qwen3.8-Flash-Next) :: (2026-09-16)
     outer x-show -> x-if (on a proper template): queue unmounts entirely
     when empty. the previously duplicated inner x-if was folded away. -->
<template x-if="$store.upload.files.length > 0">
    <div id="upload-queue-container" class="upload-queue">
        <div class="upload-section">
            <template x-for="(file, index) in $store.upload.files" :key="'pending-' + index">
                <div class="item">
                    <div class="file-info">
                        <span class="file-icon">
                            <template x-if="file.name.startsWith('pasted-image-')">
                                <span title="Pasted from clipboard">{% include 'svg/clipboard.svg' %}</span>
                            </template>
                            <template x-if="!file.name.startsWith('pasted-image-')">
                                <span title="File attachment">{% include 'svg/paperclip.svg' %}</span>
                            </template>
                        </span>
                        <span class="file-name" x-text="file.name"></span>
                    </div>
                    <button class="delete" @click="$store.upload.removeFile(index)" aria-label="Remove file">&times;</button>
                </div>
            </template>
        </div>
    </div>
</template>
