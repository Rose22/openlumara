<div class="flex fullwidth">
    <!-- Reasoning block -->
    <template x-if="message.type === 'reasoning'">
        {% include 'chat/reasoning.html' %}
    </template>

    <!-- Content block -->
    <!-- -- AI GENERATED CODE (Qwen3.8-Flash-Next) :: (2026-09-16)
         live check now uses object identity instead of index, since the
         chain/final split makes per-loop indexes meaningless -->
    <template x-if="message.type === 'content'">
        <div class="content" x-md="{ message: message, live: message === $store.stream.turn.messages[$store.stream.turn.messages.length - 1] }"></div>
    </template>

    <!-- Tool calls block -->
    <template x-if="message.type === 'tool_calls' || message.type === 'tool_call_delta'">
        {% include 'chat/toolcalls.html' %}
    </template>
</div>
