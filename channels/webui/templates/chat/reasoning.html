<!-- -- AI GENERATED CODE (Qwen3.8-Flash-Next) :: (2026-09-16)
     Auto-collapse reasoning once it's done thinking: a reasoning block is
     finished when it's no longer the last segment of the live stream (a
     content/tool_calls segment followed it) or the stream went idle.
     autoCollapsed guards against re-collapsing if the user expands it again. -->
<div :class="{'reasoning-wrapper': true, 'collapsed': collapsed, 'expanded': !collapsed, 'is-reasoning-active': !done}"
     x-data="{collapsed: $store.stream.state === 'idle', autoCollapsed: false, done: $store.stream.state === 'idle'}"
     x-effect="const msgs = $store.stream.turn?.messages ?? []; const isLast = msgs[msgs.length - 1] === message; done = $store.stream.state === 'idle' || !isLast; if (done && !autoCollapsed) { autoCollapsed = true; collapsed = true }"
     @click="collapsed = !collapsed">
    <div class="header">
        <!-- -- AI GENERATED CODE (Qwen3.8-Flash-Next) :: (2026-09-16) -->
        <!-- Chevron now rotates on collapse/expand to match tool call cards. -->
        <svg :class="{'toggle': true, 'toggle-expanded': !collapsed}" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
        {% include 'svg/thought_bubble.svg' %}
        <span class="text">
            <!-- -- AI GENERATED CODE (Qwen3.8-Flash-Next) :: (2026-09-16)
                 Label flips from 'Thinking..' to 'Thoughts' once the block is
                 done; animated dots only show while actively thinking. -->
            <span class="label" x-text="done ? 'Thoughts' : 'Thinking..'"></span>
            <span class="dots" x-show="!done"><span aria-hidden="true">&nbsp;</span><span aria-hidden="true">&nbsp;</span><span aria-hidden="true">&nbsp;</span></span>
        </span>
    </div>

    <!-- -- AI GENERATED CODE (Qwen3.8-Flash-Next) :: (2026-09-15)
         x-if (on a proper <template>!) instead of x-show: collapsed reasoning
         text is now fully unmounted instead of sitting in the dom for the
         lifetime of the tab. reasoning blocks are often the largest text in
         tool-heavy chats. -->
    <template x-if="!collapsed">
        <div class="block">
            <!-- -- AI GENERATED CODE (Qwen3.8-Flash-Next) :: (2026-09-16)
                 x-fade-text: streamed reasoning fades in per token, like content -->
            <div class="content" x-fade-text="message.reasoning_content" x-auto-scroll></div>
        </div>
    </template>
</div>
