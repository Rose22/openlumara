<!DOCTYPE html>
<html lang="en" x-data="{ username: '', password: '', loading: false }">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - OpenLumara</title>
    <link rel="stylesheet" href="{{ url_for('assets', path='css/base/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('assets', path='css/base/variables.css') }}">
    <link rel="stylesheet" href="{{ url_for('assets', path='css/login.css') }}">
    
    {# css files from modules (webui extensions) #}
    {% for url in ext_css_files %}
    <link rel="stylesheet" href="{{ url }}">
    {% endfor %}
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <h1>OpenLumara</h1>
            <form method="POST" action="/login" @submit="loading = true">
                {{ extension_slot("top") }}

                {% if error %}
                    <div class="error-msg">{{ error }}</div>
                {% endif %}
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" x-model="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-wrap">
                        <input type="password" id="password" name="password" x-model="password" required>
                        <button type="button" id="pw-toggle" class="pw-toggle" title="Reveal password" aria-label="Reveal password" tabindex="-1">
                            <span class="icon-eye">{% include 'svg/eye.svg' %}</span>
                            <span class="icon-eye-off" style="display:none;">{% include 'svg/eye_off.svg' %}</span>
                        </button>
                    </div>
                </div>

                {{ extension_slot("before_signin_button") }}

                <button type="submit" :disabled="loading">Sign In</button>

                {{ extension_slot("bottom") }}
            </form>
        </div>
    </div>
    <script>
        // reveal toggle for the password field (vanilla JS: login page has no Alpine build)
        (() => {
            const btn = document.getElementById('pw-toggle');
            const input = document.getElementById('password');
            const eye = btn.querySelector('.icon-eye');
            const eyeOff = btn.querySelector('.icon-eye-off');
            btn.addEventListener('click', () => {
                const reveal = input.type === 'password';
                input.type = reveal ? 'text' : 'password';
                eye.style.display = reveal ? 'none' : '';
                eyeOff.style.display = reveal ? '' : 'none';
                btn.title = reveal ? 'Hide password' : 'Reveal password';
                btn.setAttribute('aria-label', btn.title);
            });
        })();
    </script>
</body>
</html>
