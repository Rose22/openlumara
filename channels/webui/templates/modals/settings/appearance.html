<template x-if="activeCategory === 'appearance' && !activeModule && !activeChannel">
    <div class="settings-section">
        <h3 class="section-title" x-text="$store.settings.categories.appearance.title"></h3>
        <p class="section-desc" x-text="$store.settings.categories.appearance.description"></p>

        <hr>

        <!-- Theme Controls Row -->
        <h4>Color Theme</h4>
        <div class="theme-controls-row" x-init="$nextTick(() => { 
            const store = Alpine.store('theme'); 
            if (store.family && $refs.themeSelect) { 
                $refs.themeSelect.value = store.family; 
            }
        })">
            <div class="theme-dropdown-wrapper">
                <select x-ref="themeSelect" x-model="Alpine.store('theme').family" @change="selectThemeFamily($store.theme.family)" class="theme-select">
                    <template x-for="group in getThemeGroups()" :key="group">
                        <optgroup :label="getThemeGroupName(group)">
                            <template x-for="theme in getThemeFamilies().groups[group]" :key="theme.name">
                                <option :value="theme.name" x-text="formatThemeName(theme.name)"></option>
                            </template>
                        </optgroup>
                    </template>
                    <template x-if="getThemeFamilies().others.length > 0">
                        <optgroup label="Other">
                            <template x-for="theme in getThemeFamilies().others" :key="theme.name">
                                <option :value="theme.name" x-text="formatThemeName(theme.name)"></option>
                            </template>
                        </optgroup>
                    </template>
                </select>
            </div>

            <!-- Mode Toggle -->
            <div class="theme-mode-toggle">
                <button type="button" 
                        @click="toggleThemeMode(false)" 
                        :class="{ active: themeMode === 'dark' }"
                        :disabled="!themeHasMode('dark')"
                        class="mode-button"
                        title="Dark mode">
                    {% include 'svg/moon.svg' %}
                </button>
                <button type="button" 
                        @click="toggleThemeMode(true)" 
                        :class="{ active: themeMode === 'light' }"
                        :disabled="!themeHasMode('light')"
                        class="mode-button"
                        title="Light mode">
                    {% include 'svg/sun.svg' %}
                </button>
            </div>
        </div>
        
        
        <!-- Typography Settings -->
        <div class="typography-section">
            <h4>Typography</h4>
            
            <!-- Font Family -->
            <div class="setting-item">
                <select name="font-family" x-model="fontFamily" @change="handleFontChange($event.target.value)">
                    <option value="default">System Default</option>
                    <option value="Arial">Arial</option>
                    <option value="Helvetica">Helvetica</option>
                    <option value="Calibri">Calibri</option>
                    <option value="Segoe UI">Segoe UI</option>
                    <option value="Georgia">Georgia</option>
                    <option value="Verdana">Verdana</option>
                    <option value="Consolas">Consolas</option>
                    <option value="Courier New">Courier New</option>
                    <option value="Inter">Inter</option>
                    <option value="Roboto">Roboto</option>
                    <option value="Roboto Mono">Roboto Mono</option>
                    <option value="Lato">Lato</option>
                    <option value="Open Sans">Open Sans</option>
                    <option value="Ubuntu">Ubuntu</option>
                    <option value="Poppins">Poppins</option>
                    <option value="Montserrat">Montserrat</option>
                    <option value="Nunito">Nunito</option>
                    <option value="Source Sans 3">Source Sans 3</option>
                    <option value="Inconsolata">Inconsolata</option>
                    <option value="Raleway">Raleway</option>
                    <option value="Quicksand">Quicksand</option>
                    <option value="Comfortaa">Comfortaa</option>
                    <option value="Fredoka">Fredoka</option>
                    <option value="Pacifico">Pacifico</option>
                    <option value="Lobster">Lobster</option>
                    <option value="Dancing Script">Dancing Script</option>
                    <option value="Caveat">Caveat</option>
                </select>
            </div>
            
            <!-- Font Size Slider -->
            <div class="setting-item">
                <div class="slider-header">
                    <span class="slider-label">Font Size</span>
                    <span class="slider-value" x-text="fontSize + 'px'"></span>
                </div>
                <input type="range" 
                       x-model.number="fontSize" 
                       min="12" 
                       max="24"
                       @input="handleFontSize($event.target.value)">
            </div>
            
            <!-- Chat Width Slider -->
            <div class="setting-item">
                <div class="slider-header">
                    <span class="slider-label">Chat Width</span>
                    <span class="slider-value" x-text="chatWidth + '%'"></span>
                </div>
                <input type="range" 
                       x-model.number="chatWidth" 
                       min="20" 
                       max="100"
                       @input="handleChatWidth($event.target.value)">
            </div>

            <h4>Preferences</h4>

            <div class="item">
                <div class="toggle-row">
                    <label>Collapse processing chain by default</label>
                    <button class="toggle" type="button" :class="{ active: collapseChainDefault }" @click="handleCollapseChainToggle()">
                    </button>
                </div>
                <span class="description">Hide the details of what your AI is doing from you, and instead only show the basics on one line while your AI works. You can still expand the chain by clicking on it.</span>
            </div>

            <!-- -- AI GENERATED CODE (Qwen3.8-Flash-Next) :: (2026-09-17)
             Tool call cards: collapsed while streaming, details on expand. -->
            <div class="item">
                <div class="toggle-row">
                    <label>Collapse tool calls by default</label>
                    <button class="toggle" type="button" :class="{ active: collapseToolcallsDefault }" @click="handleCollapseToolcallsToggle()">
                    </button>
                </div>
                <span class="description">Keep streaming tool calls collapsed to just their header. You can still expand them by clicking to see arguments and responses.</span>
            </div>

            <div class="item">
                <div class="toggle-row">
                    <label>Fade tokens</label>
                    <button class="toggle" type="button" :class="{ active: tokenFadeEnabled }" @click="handleTokenFadeToggle()">
                    </button>
                </div>
                <span class="description">Apply a nice, gentle fade animation to every token that comes in.</span>
            </div>

            <!-- -- AI GENERATED CODE (Qwen3.8-Flash-Next) :: (2026-09-16)
             Streamed token fade settings: toggle + speed slider. Applied
             live from localStorage (no save needed), like the other
             appearance options. -->
            <div class="setting-item" x-show="tokenFadeEnabled">
                <div class="slider-header">
                    <span class="slider-label">Fade Duration</span>
                    <span class="slider-value" x-text="tokenFadeMs + 'ms'"></span>
                </div>
                <input type="range"
                       x-model.number="tokenFadeMs"
                       min="50"
                       max="1000"
                       step="50"
                       @input="handleTokenFadeSpeed($event.target.value)">
            </div>
        </div>
    </div>
</template>
