<template x-if="activeCategory === 'appearance' && !activeModule && !activeChannel">
    <div class="settings-section">
        <h3 class="section-title" x-text="$store.settings.categories.appearance.title"></h3>
        <p class="section-desc" x-text="$store.settings.categories.appearance.description"></p>

        <hr>

        <!-- Theme Controls Row -->
        <h4>Color Theme</h4>
        <div class="theme-controls-row" x-init="$nextTick(() => { 
            const store = Alpine.store('theme'); 
            if (store.family && $refs.themeSelect) { 
                $refs.themeSelect.value = store.family; 
            }
        })">
            <div class="theme-dropdown-wrapper">
                <select x-ref="themeSelect" x-model="Alpine.store('theme').family" @change="selectThemeFamily($store.theme.family)" class="theme-select">
                    <template x-for="group in getThemeGroups()" :key="group">
                        <optgroup :label="getThemeGroupName(group)">
                            <template x-for="theme in getThemeFamilies().groups[group]" :key="theme.name">
                                <option :value="theme.name" x-text="formatThemeName(theme.name)"></option>
                            </template>
                        </optgroup>
                    </template>
                    <template x-if="getThemeFamilies().others.length > 0">
                        <optgroup label="Other">
                            <template x-for="theme in getThemeFamilies().others" :key="theme.name">
                                <option :value="theme.name" x-text="formatThemeName(theme.name)"></option>
                            </template>
                        </optgroup>
                    </template>
                </select>
            </div>

            <!-- Mode Toggle -->
            <div class="theme-mode-toggle">
                <button type="button" 
                        @click="toggleThemeMode(false)" 
                        :class="{ active: themeMode === 'dark' }"
                        :disabled="!themeHasMode('dark')"
                        class="mode-button"
                        title="Dark mode">
                    {% include 'svg/moon.svg' %}
                </button>
                <button type="button" 
                        @click="toggleThemeMode(true)" 
                        :class="{ active: themeMode === 'light' }"
                        :disabled="!themeHasMode('light')"
                        class="mode-button"
                        title="Light mode">
                    {% include 'svg/sun.svg' %}
                </button>
            </div>
        </div>
        
        
        <!-- Theme Repos: pull themes straight from a git repo -->
        <div class="module-library" x-data="repoManager('theme')">
            <div class="library-message" x-show="message" x-cloak :class="messageKind" x-text="message"></div>

            <div class="library-urlbar">
                <input type="text" class="library-url-input" spellcheck="false"
                       placeholder="https://github.com/username/my-theme-pack"
                       x-model="newRepoUrl" @keydown.enter.prevent="stageAndInstall()">
                <button type="button" class="library-btn primary" @click="stageAndInstall()"
                        :disabled="staging || committing || !newRepoUrl.trim()">
                    <span x-text="staging ? (clonePercent >= 5 ? 'Downloading ' + clonePercent + '%' : 'Downloading..') : 'Download Theme Repo'"></span>
                </button>
                <button type="button" class="library-btn danger" x-show="staging" x-cloak
                        @click="cancelClone()" :disabled="cancelling">
                    <span x-text="cancelling ? 'Cancelling..' : 'Cancel'"></span>
                </button>
            </div>

            <div class="library-clone-progress" x-show="staging" x-cloak>
                <div class="library-clone-fill" :style="'width: ' + clonePercent + '%'"></div>
            </div>

            <template x-for="m in entries" :key="m.name">
                <div class="library-item installed">
                    <div class="library-item-main">
                        <div class="library-item-header">
                            <span class="library-item-name" x-text="formatLabel(m.name)"></span>
                        </div>
                        <p class="library-item-repo" x-show="repoLabel(m)" x-text="repoLabel(m)" title="comes from this repo"></p>
                    </div>
                    <div class="library-item-actions">
                        <button type="button" class="library-btn danger" @click="uninstall(m)"
                                :disabled="busyName !== null || committing">
                            <span x-text="busyName === m.name ? 'Working..' : 'Remove'"></span>
                        </button>
                    </div>
                </div>
            </template>
        </div>

        <div class="bg-section">
            <h4>Background Image</h4>
            <div class="item">
                <div class="toggle-row">
                    <label>Background image</label>
                    <button class="toggle" type="button" :class="{ active: $store.background.enabled }"
                            @click="$store.background.toggle()"></button>
                </div>
                <span class="description">Put a picture behind the interface. It stays readable by dimming it with the brightness slider, or blurring it into soft shapes.</span>
            </div>

            <div class="bg-settings" x-show="$store.background.enabled" x-cloak>
                <input type="file" accept="image/*" x-ref="bgFileInput" x-show="false" x-cloak aria-hidden="true"
                       @change="$store.background.handleUpload($event)">

                <div class="bg-upload-row">
                    <template x-if="$store.background.dataUrl">
                        <img class="bg-thumb" :src="$store.background.dataUrl" alt="background preview">
                    </template>
                    <button type="button" class="bg-upload-btn" @click="$refs.bgFileInput.click()">
                        {% include 'svg/upload.svg' %}
                        <span x-text="$store.background.dataUrl ? 'Replace image' : 'Upload image'"></span>
                    </button>
                    <button type="button" class="bg-remove-btn" x-show="$store.background.dataUrl" x-cloak
                            @click="$store.background.clear()" title="Remove the background image">
                        {% include 'svg/trash.svg' %}
                    </button>
                </div>

                <p class="error" x-show="$store.background.error" x-cloak x-text="$store.background.error"></p>

                <div class="bg-mode-row" x-show="$store.background.dataUrl" x-cloak>
                    <span class="slider-label">Fill area</span>
                    <div class="bg-mode-toggle">
                        <button type="button" :class="{ active: $store.background.mode === 'chat' }"
                                @click="$store.background.setMode('chat')">Chat window</button>
                        <button type="button" :class="{ active: $store.background.mode === 'page' }"
                                @click="$store.background.setMode('page')">Entire page</button>
                    </div>
                </div>

                <div class="setting-item" x-show="$store.background.dataUrl" x-cloak>
                    <div class="slider-header">
                        <span class="slider-label">Brightness</span>
                        <span class="slider-value" x-text="$store.background.brightness + '%'"></span>
                    </div>
                    <input type="range" min="20" max="150"
                           :value="$store.background.brightness"
                           :style="'--fill: ' + (($store.background.brightness - 20) / 130 * 100) + '%'"
                           @input="$store.background.setBrightness(parseInt($event.target.value))">
                </div>

                <div class="setting-item" x-show="$store.background.dataUrl" x-cloak>
                    <div class="slider-header">
                        <span class="slider-label">Blur</span>
                        <span class="slider-value" x-text="$store.background.blur + 'px'"></span>
                    </div>
                    <input type="range" min="0" max="24"
                           :value="$store.background.blur"
                           :style="'--fill: ' + ($store.background.blur / 24 * 100) + '%'"
                           @input="$store.background.setBlur(parseInt($event.target.value))">
                </div>
            </div>
        </div>

        <!-- Typography Settings -->
        <div class="typography-section">
            <h4>Typography</h4>
            
            <!-- Font Family -->
            <div class="setting-item">
                <select name="font-family" x-model="fontFamily" @change="handleFontChange($event.target.value)">
                    <option value="default">System Default</option>
                    <option value="Arial">Arial</option>
                    <option value="Helvetica">Helvetica</option>
                    <option value="Calibri">Calibri</option>
                    <option value="Segoe UI">Segoe UI</option>
                    <option value="Georgia">Georgia</option>
                    <option value="Verdana">Verdana</option>
                    <option value="Consolas">Consolas</option>
                    <option value="Courier New">Courier New</option>
                    <option value="Inter">Inter</option>
                    <option value="Roboto">Roboto</option>
                    <option value="Roboto Mono">Roboto Mono</option>
                    <option value="Lato">Lato</option>
                    <option value="Open Sans">Open Sans</option>
                    <option value="Ubuntu">Ubuntu</option>
                    <option value="Poppins">Poppins</option>
                    <option value="Montserrat">Montserrat</option>
                    <option value="Nunito">Nunito</option>
                    <option value="Source Sans 3">Source Sans 3</option>
                    <option value="Inconsolata">Inconsolata</option>
                    <option value="Raleway">Raleway</option>
                    <option value="Quicksand">Quicksand</option>
                    <option value="Comfortaa">Comfortaa</option>
                    <option value="Fredoka">Fredoka</option>
                    <option value="Pacifico">Pacifico</option>
                    <option value="Lobster">Lobster</option>
                    <option value="Dancing Script">Dancing Script</option>
                    <option value="Caveat">Caveat</option>
                </select>
            </div>
            
            <!-- Font Size Slider -->
            <div class="setting-item">
                <div class="slider-header">
                    <span class="slider-label">Font Size</span>
                    <span class="slider-value" x-text="fontSize + 'px'"></span>
                </div>
                <input type="range" 
                       x-model.number="fontSize" 
                       min="12" 
                       max="24"
                       :style="'--fill: ' + ((fontSize - 12) / 12 * 100) + '%'"
                       @input="handleFontSize($event.target.value)">
            </div>
            
            <!-- Chat Width Slider -->
            <div class="setting-item">
                <div class="slider-header">
                    <span class="slider-label">Chat Width</span>
                    <span class="slider-value" x-text="chatWidth + '%'"></span>
                </div>
                <input type="range" 
                       x-model.number="chatWidth" 
                       min="20" 
                       max="100"
                       :style="'--fill: ' + ((chatWidth - 20) / 80 * 100) + '%'"
                       @input="handleChatWidth($event.target.value)">
            </div>

            <h4>Preferences</h4>

            <div class="item">
                <div class="toggle-row">
                    <label>Collapse processing chain</label>
                    <button class="toggle" type="button" :class="{ active: collapseChainDefault }" @click="handleCollapseChainToggle()">
                    </button>
                </div>
                <span class="description">Hide the details of what your AI is doing from you, and instead only show the basics on one line while your AI works. You can still expand the chain by clicking on it.</span>
            </div>

            <div class="item">
                <div class="toggle-row">
                    <label for="step-display-mode">Step display mode</label>
                    <select id="step-display-mode" name="step-display-mode" x-model="stepDisplayMode" @change="handleStepDisplayModeChange($event.target.value)">
                        <option value="default">Default (don't collapse anything)</option>
                        <option value="thinking">Collapse thinking only</option>
                        <option value="steps">Collapse entire step</option>
                    </select>
                </div>
                <span class="description">Sets how each individual step gets displayed. Either full detail, collapsed thinking but you still see the tool streams, or just completely collapse each step</span>
            </div>

            <div class="item">
                <div class="toggle-row">
                    <label>Frosted glass</label>
                    <button class="toggle" type="button" :class="{ active: frostedGlassEnabled }" @click="handleFrostedGlassToggle()">
                    </button>
                </div>
                <span class="description">Blur and soften what passes beneath overlays like the pinned prompt and the floating input bar. Turn off for solid backgrounds instead.</span>
            </div>

            <div class="item">
                <div class="toggle-row">
                    <label>Pinned prompts</label>
                    <button class="toggle" type="button" :class="{ active: pinnedPromptsEnabled }" @click="handlePinnedPromptsToggle()">
                    </button>
                </div>
                <span class="description">Keep the user message above the response you're reading pinned to the top of the chat, shrunk to a single line. Only shows while no user message is visible in the chat itself, and grows back once you scroll it into view.</span>
            </div>

            <div class="item">
                <div class="toggle-row">
                    <label>Fade tokens</label>
                    <button class="toggle" type="button" :class="{ active: tokenFadeEnabled }" @click="handleTokenFadeToggle()">
                    </button>
                </div>
                <span class="description">Apply a nice, gentle fade animation to every token that comes in.</span>
            </div>

            <div class="setting-item" x-show="tokenFadeEnabled">
                <div class="slider-header">
                    <span class="slider-label">Fade Duration</span>
                    <span class="slider-value" x-text="tokenFadeMs + 'ms'"></span>
                </div>
                <input type="range"
                       x-model.number="tokenFadeMs"
                       min="50"
                       max="1000"
                       step="50"
                       :style="'--fill: ' + ((tokenFadeMs - 50) / 950 * 100) + '%'"
                       @input="handleTokenFadeSpeed($event.target.value)"
                >
            </div>

            {{ extension_slot("settings") }}
        </div>
    </div>
</template>
