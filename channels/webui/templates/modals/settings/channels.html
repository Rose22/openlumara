<!-- CHANNELS: Unified list -->
<template x-if="(activeCategory === 'channels' || activeCategory === 'user_channels') && !activeChannel">
    <div class="unified-list">
        <h3 x-text="$store.settings.categories[activeCategory].title"></h3>
        <p class="section-desc" x-text="$store.settings.categories[activeCategory].description"></p>
        
        <!-- All channels (enabled first, then disabled) -->
        <template x-for="channel in [...$store.settings.categories[activeCategory].enabled, ...$store.settings.categories[activeCategory].disabled]" :key="channel">
            <template x-if="$store.settings.showUnsafe || !$store.settings.categories[activeCategory].unsafeModules[channel]">
                <div class="unified-card" :class="{ 'disabled': !$store.settings.categories[activeCategory].enabled.includes(channel), 'unsafe': $store.settings.categories[activeCategory].unsafeModules[channel] }">
                    <div class="info" @click="activeChannel = channel">
                        <span type="button" class="channel-name-btn" x-text="formatLabel(channel)"></span>
                        <p class="description" x-html="renderMarkdown($store.settings.categories[activeCategory].descriptions[channel]) || ''"></p>
                    </div>
                    <button type="button" :class="{'toggle': true, 'toggle-off': $store.settings.categories[activeCategory].disabled.includes(channel), 'toggle-on': $store.settings.categories[activeCategory].enabled.includes(channel) }" 
                            @click="$store.settings.toggleEnabled(activeCategory, channel)">
                    </button>
                </div>
            </template>
        </template>
    </div>
</template>

<!-- CHANNELS: Drill-down -->
<template x-if="activeChannel && (activeCategory === 'channels' || activeCategory === 'user_channels')">
    <div class="channel-drilldown">
        <div x-animate.duration.120ms>
            <button type="button" @click="activeChannel = null" class="back-btn">← Back</button>
            <h3 class="section-title" x-text="formatLabel(activeChannel)"></h3>
            <p class="section-desc" x-html="renderMarkdown($store.settings.categories[activeCategory].descriptions[activeChannel]) || ''"></p>
            
            <template x-if="$store.settings.categories[activeCategory].settings[activeChannel] && $store.settings.categories[activeCategory].settings[activeChannel].value">
                <!-- -- AI GENERATED CODE (Qwen3.8-Flash-Next) :: (2026-09-16)
                     dependency x-show -> x-if templates: settings whose dependencies
                     are unmet now unmount their whole field widget instead of
                     just hiding it. -->
                <template x-for="hierarchyItem in getHierarchicalSettings()" :key="hierarchyItem.key">
                    <template x-if="$store.settings.showUnsafe || !hierarchyItem.setting.unsafe">
                        <template x-if="checkDependency(hierarchyItem.setting.depends)">
                        <div class="setting-item setting-parent" :class="{ 'unsafe': hierarchyItem.setting.unsafe }" x-data="{ setting: hierarchyItem.setting }">
                            {% include 'modals/settings/fields.html' %}
                            
                            <!-- Render dependent children -->
                            <template x-for="child in hierarchyItem.children" :key="child.key">
                                <template x-if="$store.settings.showUnsafe || !child.setting.unsafe">
                                    <template x-if="checkDependency(child.setting.depends)">
                                    <div class="setting-item setting-child" :class="{ 'unsafe': child.setting.unsafe }" x-data="{ setting: child.setting }">
                                        {% include 'modals/settings/fields.html' %}
                                    </div>
                                    </template>
                                </template>
                            </template>
                        </div>
                        </template>
                    </template>
                </template>
            </template>
        </div>
        
        <template x-if="!$store.settings.categories[activeCategory].settings[activeChannel] || !$store.settings.categories[activeCategory].settings[activeChannel].value">
            <p class="no-settings-msg">This channel has no configurable settings.</p>
        </template>
    </div>
</template>
