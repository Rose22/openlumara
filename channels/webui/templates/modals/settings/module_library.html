<!-- YOUR SKILLS tab: install skills packs from git repos and manage the skills
     on disk. Logic lives in js/components/module_library.js (repoManager) -->
<template x-if="activeCategory === 'your_skills'">
    <div class="module-library" x-data="repoManager('skill')">
        <h3 class="section-title">Your Skills</h3>
        <p class="section-desc">Skills are instruction files your AI can use. Install a skills pack by pasting its repo url - the repo needs skill folders (each containing a SKILL.md) at its root. Existing skills are never overwritten.</p>

        <div class="library-message" x-show="message" x-cloak :class="messageKind" x-text="message"></div>

        <div class="library-urlbar">
            <input type="text" class="library-url-input" spellcheck="false"
                   placeholder="https://example.com/user/my-skills-pack"
                   x-model="newRepoUrl" @keydown.enter.prevent="stageAndInstall()">
            <button type="button" class="library-btn primary" @click="stageAndInstall()"
                    :disabled="staging || committing || !newRepoUrl.trim()">
                <span x-text="staging ? (clonePercent >= 5 ? 'Downloading ' + clonePercent + '%' : 'Downloading..') : 'Install Skills Repo'"></span>
            </button>
            <button type="button" class="library-btn danger" x-show="staging" x-cloak
                    @click="cancelClone()" :disabled="cancelling">
                <span x-text="cancelling ? 'Cancelling..' : 'Cancel'"></span>
            </button>
        </div>

        <div class="library-clone-progress" x-show="staging" x-cloak>
            <div class="library-clone-fill" :style="'width: ' + clonePercent + '%'"></div>
        </div>

        <p class="library-empty" x-show="!loading && entries.length === 0">No skills installed yet.</p>

        <template x-for="m in entries" :key="m.name">
            <div class="library-item installed">
                <div class="library-item-main">
                    <div class="library-item-header">
                        <span class="library-item-name" x-text="formatLabel(m.name)"></span>
                    </div>
                    <p class="library-item-doc" x-show="m.doc" x-text="m.doc"></p>
                </div>
                <div class="library-item-actions">
                    <button type="button" class="library-btn danger" @click="uninstall(m)"
                            :disabled="busyName !== null || committing">
                        <span x-text="busyName === m.name ? 'Working..' : 'Uninstall'"></span>
                    </button>
                </div>
            </div>
        </template>

        <p class="library-note" x-show="entries.length > 0">Skills load when the server starts - run /skills reload to pick up new ones without restarting.</p>

        {% include 'modals/settings/repo_audit.html' %}
    </div>
</template>
