[project]
name = "openlumara"
version = "1.0"
description = "Modular, token-efficient, local-first AI agent framework"
requires-python = ">=3.11"
# exact pins: a version only moves when bumped by hand here
dependencies = [
  "aiohttp==3.14.5",
  "msgpack==1.2.4",
  "pyyaml==6.0.3",
  "json-repair==0.64.2",
  "partial-json-parser==0.2.1.1.post7",
  "regex==2026.9.29",
  "pypdf==6.21.2",
  "python-ulid==4.0.1",
  "prompt-toolkit==3.0.53",
  "rich==15.0.0",
]

[project.optional-dependencies]
webui = [
  "fastapi==0.162.0",
  "starlette==1.10.0",
  "itsdangerous==2.2.0",
  "websockets==17.3",
  "jinja2==3.1.6",
  "uvicorn==0.54.0",
  "python-multipart==0.0.32",
  "markupsafe==3.0.4",
]
channels = [
  "flask==3.1.3",
  "werkzeug==3.1.9",
  "discord.py==2.7.1",
  "python-telegram-bot==22.8",
  "matrix-nio[e2e]==0.26.0",
]
modules = [
  "tree-sitter==0.26.0",
  "tree-sitter-language-pack==1.22.1",
  "mcp==2.3.0",
  "beautifulsoup4==4.15.0",
  "ddgs==9.16.1",
  "simpleeval==1.0.8",
]
gui = ["PySide6==6.12.0"]

[tool.uv]
package = false

# no wheel on pypi, and its setup.py predates pyproject build deps
[tool.uv.extra-build-dependencies]
"atomicwrites" = ["setuptools"]
